# A library first — arterminal is meant to be embedded by other programs, and the bundled
# binary is only the same picker run standalone. Every dependency below carries the reason it
# is here, and the version bounds are argued rather than guessed.
[package]
name = "arterminal"
version = "0.1.0"
edition = "2021"
description = "Terminal ASCII art with colour: palettes, canvases, and the pickers that edit them"
license = "GPL-3.0-only"
repository = "https://github.com/SirHexa10t/arterminal"

[dependencies]
# The whole TUI: raw key reads, 24-bit styling, and display-width measurement. The same crate
# the sibling project `terminal_choice` trusts, so the two stay in step.
#
# 0.16.6 is a FLOOR rather than a nicety, for two independent reasons:
#   * `Color::TrueColor` — the 24-bit RGB this crate is built around — only arrived in 0.16.2.
#     A bare "0.16" is free to resolve to 0.16.0, which has no RGB at all, and the failure
#     would be a missing method rather than anything a reader could guess from the manifest.
#   * 0.16.6 fixed `truncate_str` panicking mid-character, and fixed truncation measurement in
#     visible columns. `ui::render`'s clipping was built out of exactly that machinery; it has
#     since become its own (`ui::clip`, which measures East Asian Ambiguous characters both
#     ways), so this half of the floor is history — kept, since nothing is gained by lowering it.
# (There is deliberately no 0.16.5 here: it exists as a GitHub release but was never published
# to crates.io, so the published line runs 0.16.4 -> 0.16.6.)
#
# `default-features` stays ON, and that is load-bearing rather than laziness: the `unicode-width`
# feature lives in that set, and without it `console`'s width measurement silently degrades to
# `chars().count()` and its per-character width to a hardcoded 1. Every glyph this crate exists
# to draw is non-ASCII, and nothing would fail to compile — the grid would just shear.
console = "0.16.6"

# Display widths as a terminal set to draw East Asian Ambiguous characters two columns wide
# draws them — `width_cjk`, which `console`'s own measurement never asks for. The frame must
# never be wider than the terminal, and on such a terminal `·`, `—` and `…` take two columns
# each; see `ui::clip`. Already in the tree at this version via `console`, so it costs nothing
# new.
unicode-width = "0.2"

# One blocking `poll` while waiting for a key — the guarantee that an idle picker costs 0% CPU
# lives here rather than inside a dependency's key-reading internals. Already in the tree via
# `console`, so it costs nothing new.
libc = "0.2"
